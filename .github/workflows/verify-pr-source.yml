name: Verify PR Source Branch

on:
  pull_request:
    branches:
      - main

jobs:
  check-source-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Validate Source Branch
        run: |
          HEAD_REF="${{ github.head_ref }}"
          echo "Source branch: $HEAD_REF"
          
          # Enforce that the source is either 'dev' or matches 'hotfix/*'
          if [[ "$HEAD_REF" == "dev" || "$HEAD_REF" =~ ^hotfix/ ]]; then
            echo "Branch validation passed."
            exit 0
          else
            echo "❌ Error: Pull requests into 'main' must originate from 'dev' or a 'hotfix/*' branch (found: '$HEAD_REF')."
            exit 1
          fi
